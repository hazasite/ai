<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAZA AI - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Core Styles */
        body { font-family: 'Outfit', sans-serif; background-color: #171717; color: #e8eaed; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .brand-font { font-family: 'Outfit', sans-serif; letter-spacing: -0.5px; }
        
        /* Message Rows */
        .msg-row { display: flex; gap: 16px; margin-bottom: 24px; width: 100%; animation: fadeIn 0.3s ease-out forwards; }
        .msg-user-container { justify-content: flex-end; }
        .msg-bot { flex: 1; line-height: 1.6; font-size: 1rem; color: #e8eaed; }
        
        /* User Bubble */
        .msg-user { 
            background-color: #2d2d2d; 
            color: #e8eaed;
            padding: 12px 18px; 
            border-radius: 24px; 
            max-width: 80%; 
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Avatars */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Professional Logo Style */
        .logo-brand {
            background: linear-gradient(135deg, #06b6d4, #2563eb); /* Cyan to Blue */
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .avatar-bot { 
            background: linear-gradient(135deg, #06b6d4, #2563eb); 
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
        } 
        
        .avatar-user { background: #444; color: #aaa; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Input Area */
        .input-wrapper {
            background-color: #2d2d2d;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            transition: box-shadow 0.2s;
        }
        .input-wrapper:focus-within {
            box-shadow: 0 4px 32px rgba(0,0,0,0.6);
            background-color: #333;
        }
        
        /* Markdown */
        .msg-bot pre { background: #0d0d0d; padding: 16px; border-radius: 12px; overflow-x: auto; border: 1px solid #333; margin: 16px 0; font-family: 'Courier New', monospace; font-size: 0.9em; }
        .msg-bot code { font-family: 'Courier New', monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-size: 0.9em; }
        .msg-bot pre code { background: transparent; padding: 0; color: #dcdcdc; }
        .msg-bot p { margin-bottom: 12px; }
        .msg-bot p:last-child { margin-bottom: 0; }

        /* Modals */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background-color: #212121;
            border: 1px solid #444;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        /* Attractive Button Animation */
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shine-effect {
            position: relative;
            overflow: hidden;
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            animation: shine 3s infinite;
        }

        /* General Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing-dot { width: 6px; height: 6px; background: #aaa; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="flex flex-col relative">

    <!-- Header -->
    <header class="fixed top-0 w-full h-16 bg-[#171717]/90 backdrop-blur-md z-20 flex items-center justify-between px-4 md:px-8 border-b border-white/5">
        <div class="flex items-center gap-3">
            <!-- Professional Logo: Brain Icon with Gradient -->
            <div class="w-9 h-9 rounded-xl logo-brand flex items-center justify-center shrink-0">
                <i class="fa-solid fa-brain text-white text-lg"></i>
            </div>
            <h1 class="text-xl font-medium brand-font text-white">HAZA</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <button onclick="openAuthModal()" class="relative group" id="header-profile-btn">
                <div class="avatar avatar-user w-9 h-9 border border-gray-600 cursor-pointer hover:border-cyan-400 transition">
                    <img id="header-avatar-img" src="" alt="User" style="display: none;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <i class="fa-solid fa-user text-sm" id="header-default-icon"></i>
                </div>
                <div class="absolute w-3 h-3 bg-green-500 rounded-full bottom-0 right-0 border-2 border-[#171717]" id="online-indicator"></div>
            </button>
            <a href="index.html" class="text-gray-400 hover:text-white transition text-lg">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto pt-24 pb-40 w-full flex flex-col items-center">
        <div class="w-full max-w-3xl px-4 md:px-6 flex flex-col gap-6" id="chat-inner">
            <!-- Messages go here -->
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="fixed bottom-0 w-full p-4 z-30 bg-gradient-to-t from-[#171717] via-[#171717] to-transparent pt-10">
        <div class="max-w-3xl mx-auto relative">
            <!-- FIX: Changed items-end to items-center to keep icons centered when growing -->
            <div class="input-wrapper rounded-full flex items-center px-4 py-2 border border-white/10 relative">
                <button class="text-gray-400 hover:text-white p-2 rounded-full transition shrink-0">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <textarea id="user-input" rows="1" placeholder="Message HAZA AI..." class="w-full bg-transparent text-white px-3 py-3 focus:outline-none resize-none max-h-40 text-base placeholder-gray-500 my-3"></textarea>
                <!-- FIX: Removed mb-0.5, flex-center handles alignment -->
                <button onclick="sendMessage()" id="send-btn" class="bg-white text-black p-2.5 rounded-full hover:bg-gray-200 transition shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            <p class="text-center text-xs text-gray-500 mt-3">HAZA AI can make mistakes. Consider checking important information.</p>
        </div>
    </footer>

    <!-- ================= AUTH MODAL ================= -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="modal-content w-full max-w-md rounded-3xl p-8 transform transition-all scale-100 overflow-y-auto max-h-[90vh]">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-gray-700 rounded-full mx-auto flex items-center justify-center mb-4 border border-gray-500 overflow-hidden relative">
                    <img id="modal-preview-img" src="" class="w-full h-full object-cover hidden" alt="Preview">
                    <i class="fa-solid fa-user text-3xl text-gray-400" id="modal-preview-icon"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-1">Create Account</h2>
                <p class="text-gray-400 text-sm">Enter your details to start chatting</p>
            </div>

            <div class="space-y-4">
                <!-- Name -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Display Name</label>
                    <input type="text" id="auth-name" class="w-full bg-[#111] border border-gray-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition" placeholder="e.g. Alex Doe">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" id="auth-email" class="w-full bg-[#111] border border-gray-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition" placeholder="alex@example.com">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="auth-password" class="w-full bg-[#111] border border-gray-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
                </div>
                
                <!-- Profile Photo -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Profile Photo</label>
                    
                    <!-- Manual Input (Optional) -->
                    <div class="relative mb-3">
                        <input type="text" id="auth-avatar" class="w-full bg-[#111] border border-gray-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition text-sm" placeholder="Paste image URL here (optional)">
                        <button onclick="clearAvatarInput()" id="clear-url-btn" class="absolute right-3 top-3 text-gray-500 hover:text-white hidden" title="Clear">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>
                    <div class="text-xs text-gray-500 mb-3 flex justify-between items-center">
                        <span>Or generate one automatically:</span>
                    </div>

                    <!-- IMPROVED: Prominent AI Generator Button -->
                    <button onclick="openImageGenModal()" class="shine-effect w-full group relative bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(124,58,237,0.5)] hover:shadow-[0_0_30px_rgba(124,58,237,0.7)] transition-all duration-300 transform hover:-translate-y-1 flex items-center justify-center gap-3 overflow-hidden">
                        <div class="relative">
                            <i class="fa-solid fa-wand-magic-sparkles text-xl animate-pulse"></i>
                        </div>
                        <span class="text-lg tracking-wide">Create Avatar with AI</span>
                        <i class="fa-solid fa-chevron-right opacity-60 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                    <!-- END IMPROVEMENT -->
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="closeAuthModal()" class="flex-1 bg-transparent border border-gray-600 text-gray-300 hover:bg-gray-800 py-3 rounded-xl transition">Cancel</button>
                <button onclick="saveProfile()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-cyan-900/50">Save Profile</button>
            </div>
        </div>
    </div>

    <!-- ================= IMAGE GENERATOR MODAL ================= -->
    <div id="image-gen-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center modal-overlay p-4">
        <div class="modal-content w-full max-w-sm rounded-3xl p-6 transform transition-all scale-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-paintbrush text-cyan-400"></i> AI Avatar Creator
                </h3>
                <button onclick="closeImageGenModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <p class="text-sm text-gray-400 mb-3">Describe your avatar below:</p>
            
            <div class="relative mb-4">
                <textarea id="img-prompt" rows="2" class="w-full bg-[#111] border border-gray-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-cyan-500 resize-none" placeholder="e.g. A futuristic robot with blue eyes, digital art"></textarea>
            </div>

            <!-- Image Preview Area -->
            <div class="w-full aspect-square bg-[#111] border border-gray-700 rounded-xl mb-4 flex items-center justify-center overflow-hidden relative group">
                
                <!-- Loading Spinner -->
                <div id="gen-loading" class="hidden absolute inset-0 bg-black/50 z-10 flex flex-col items-center justify-center">
                    <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                    <span class="text-xs text-cyan-400 animate-pulse">Creating Magic...</span>
                </div>

                <!-- Result Image -->
                <img id="gen-result-img" src="" alt="Generated Avatar" class="w-full h-full object-cover hidden">
                
                <!-- Placeholder -->
                <div id="gen-placeholder" class="text-center text-gray-600">
                    <i class="fa-solid fa-image text-4xl mb-2 opacity-50"></i>
                    <p class="text-xs">Preview will appear here</p>
                </div>
            </div>

            <button onclick="generateImage()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-medium py-2.5 rounded-xl mb-3 transition text-sm">
                Generate Image
            </button>
            
            <button onclick="useGeneratedImage()" id="btn-use-image" disabled class="w-full bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> Use This Photo
            </button>
        </div>
    </div>

    <script>
        // --- Variables ---
        const chatContainerInner = document.getElementById('chat-inner');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        // Auth Elements
        const authModal = document.getElementById('auth-modal');
        const authName = document.getElementById('auth-name');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authAvatar = document.getElementById('auth-avatar');
        const modalPreviewImg = document.getElementById('modal-preview-img');
        const modalPreviewIcon = document.getElementById('modal-preview-icon');
        const clearUrlBtn = document.getElementById('clear-url-btn');

        // Image Gen Elements
        const imgGenModal = document.getElementById('image-gen-modal');
        const imgPrompt = document.getElementById('img-prompt');
        const genResultImg = document.getElementById('gen-result-img');
        const genPlaceholder = document.getElementById('gen-placeholder');
        const genLoading = document.getElementById('gen-loading');
        const btnUseImage = document.getElementById('btn-use-image');
        
        let userProfile = null;
        let currentGeneratedUrl = "";
        let aiGeneratedUrl = null; 

        // --- Initialization ---
        window.onload = () => {
            loadUserProfile();
            
            if (!userProfile) {
                openAuthModal();
            } else {
                addMessage(`Hello **${userProfile.name}**! \nI am **HAZA AI**. How can I help you today?`, 'bot');
            }
        };

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim().length > 0) {
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // --- Auth / Profile Logic ---

        function loadUserProfile() {
            const stored = localStorage.getItem('haza_user_profile');
            if (stored) {
                userProfile = JSON.parse(stored);
                updateHeaderProfile();
            }
        }

        function openAuthModal() {
            if (userProfile) {
                authName.value = userProfile.name;
                authEmail.value = userProfile.email || '';
                authPassword.value = ''; 
                
                if (userProfile.avatarUrl) {
                    updateModalPreview(userProfile.avatarUrl);
                    authAvatar.value = "";
                    aiGeneratedUrl = userProfile.avatarUrl; 
                } else {
                    authAvatar.value = '';
                    aiGeneratedUrl = null;
                    updateModalPreview('');
                }
            } else {
                authName.value = '';
                authEmail.value = '';
                authPassword.value = '';
                authAvatar.value = '';
                aiGeneratedUrl = null;
                updateModalPreview('');
            }
            authModal.classList.remove('hidden');
        }

        function closeAuthModal() {
            authModal.classList.add('hidden');
        }

        // Live preview in Auth modal
        authAvatar.addEventListener('input', (e) => {
            aiGeneratedUrl = null; 
            updateModalPreview(e.target.value);
            if(e.target.value.length > 0) clearUrlBtn.classList.remove('hidden');
            else clearUrlBtn.classList.add('hidden');
        });

        function clearAvatarInput() {
            authAvatar.value = '';
            aiGeneratedUrl = null;
            updateModalPreview('');
            clearUrlBtn.classList.add('hidden');
        }

        function updateModalPreview(url) {
            if (url && url.match(/^http/)) {
                modalPreviewImg.src = url;
                modalPreviewImg.classList.remove('hidden');
                modalPreviewIcon.classList.add('hidden');
            } else {
                modalPreviewImg.src = '';
                modalPreviewImg.classList.add('hidden');
                modalPreviewIcon.classList.remove('hidden');
            }
        }

        function saveProfile() {
            const name = authName.value.trim();
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            const avatarUrl = aiGeneratedUrl ? aiGeneratedUrl : authAvatar.value.trim();

            if (!name) {
                alert("Please enter a name.");
                return;
            }

            userProfile = {
                name: name,
                email: email,
                password: password, 
                avatarUrl: avatarUrl
            };

            localStorage.setItem('haza_user_profile', JSON.stringify(userProfile));
            updateHeaderProfile();
            closeAuthModal();
            
            const hasMessages = document.querySelector('.msg-row');
            if (!hasMessages) {
                 addMessage(`Hello **${userProfile.name}**! \nI am **HAZA AI**. How can I help you today?`, 'bot');
            }
        }

        function updateHeaderProfile() {
            const img = document.getElementById('header-avatar-img');
            const icon = document.getElementById('header-default-icon');

            if (userProfile && userProfile.avatarUrl) {
                img.src = userProfile.avatarUrl;
                img.style.display = 'block';
                icon.style.display = 'none';
            } else {
                img.style.display = 'none';
                icon.style.display = 'flex';
            }
        }

        // --- Image Generator Logic ---

        function openImageGenModal() {
            imgGenModal.classList.remove('hidden');
            imgPrompt.value = '';
            genResultImg.src = '';
            genResultImg.classList.add('hidden');
            genPlaceholder.classList.remove('hidden');
            btnUseImage.disabled = true;
            currentGeneratedUrl = "";
        }

        function closeImageGenModal() {
            imgGenModal.classList.add('hidden');
        }

        function generateImage() {
            const prompt = imgPrompt.value.trim();
            if (!prompt) {
                alert("Please describe the image you want.");
                return;
            }

            genLoading.classList.remove('hidden');
            genPlaceholder.classList.add('hidden');
            genResultImg.classList.add('hidden');
            btnUseImage.disabled = true;

            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=500&height=500&nologo=true`;

            const tempImg = new Image();
            tempImg.onload = () => {
                genResultImg.src = imageUrl;
                genResultImg.classList.remove('hidden');
                genLoading.classList.add('hidden');
                btnUseImage.disabled = false;
                currentGeneratedUrl = imageUrl;
            };
            tempImg.onerror = () => {
                genLoading.classList.add('hidden');
                genPlaceholder.classList.remove('hidden');
                alert("Failed to generate image. Try a different prompt.");
            };
            tempImg.src = imageUrl;
        }

        function useGeneratedImage() {
            if (currentGeneratedUrl) {
                aiGeneratedUrl = currentGeneratedUrl; 
                authAvatar.value = ""; 
                updateModalPreview(currentGeneratedUrl); 
                closeImageGenModal();
            }
        }

        // --- Chat Logic (API) ---

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const loadingId = showTyping();

            // SPECIFIC LOGIC: Check for "Who are you"
            if (text.toLowerCase().includes("who are you")) {
                removeTyping(loadingId);
                addMessage("I'm HAZA AI. Author is Janma Hasarel", 'bot');
                return;
            }

            try {
                // GENERAL LOGIC: Inject identity for all other questions
                // We prepend the identity so the AI knows who it is for other answers too
                const promptWithIdentity = `I am HAZA AI. My author is Janma Hasarel. ${text}`;
                
                const apiUrl = `https://text.pollinations.ai/${encodeURIComponent(promptWithIdentity)}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.text();
                removeTyping(loadingId);
                addMessage(data, 'bot');

            } catch (error) {
                console.error("Error:", error);
                removeTyping(loadingId);
                addMessage("සමාවන්න, සේවාදායකය කාර්යබහුලයි. කරුණාකර පිටුව Refresh කර නැවත උත්සාහ කරන්න.", 'bot');
            }
        }

        function addMessage(text, sender) {
            const row = document.createElement('div');
            const isBot = sender === 'bot';
            
            row.className = isBot ? 'msg-row' : 'msg-row msg-user-container';

            // Avatar HTML
            let avatarHTML = '';
            if (isBot) {
                avatarHTML = `
                    <div class="avatar avatar-bot shrink-0">
                        <i class="fa-solid fa-brain text-white text-xs"></i>
                    </div>
                `;
            } else {
                // User Avatar
                let userAvatarContent = '';
                if (userProfile && userProfile.avatarUrl) {
                    userAvatarContent = `<img src="${userProfile.avatarUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><i class="fa-solid fa-user text-sm"></i>`;
                } else {
                    userAvatarContent = `<i class="fa-solid fa-user text-sm"></i>`;
                }

                avatarHTML = `
                    <div class="avatar avatar-user shrink-0 order-2">
                        ${userAvatarContent}
                    </div>
                `;
            }

            // Content HTML
            let contentHTML = '';
            if (isBot) {
                marked.setOptions({ breaks: true });
                contentHTML = `<div class="msg-bot">${marked.parse(text)}</div>`;
            } else {
                contentHTML = `<div class="msg-user">${text}</div>`;
            }

            // Assembly
            if (isBot) {
                row.innerHTML = avatarHTML + contentHTML;
            } else {
                row.innerHTML = contentHTML + avatarHTML;
            }

            chatContainerInner.appendChild(row);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function showTyping() {
            const id = 't-' + Date.now();
            const row = document.createElement('div');
            row.id = id;
            row.className = 'msg-row';
            
            row.innerHTML = `
                <div class="avatar avatar-bot shrink-0">
                    <i class="fa-solid fa-brain text-white text-xs"></i>
                </div>
                <div class="msg-bot flex items-center gap-1 h-10">
                    <div class="typing-dot"></div>
                    <div class="typing-dot" style="animation-delay: 0.2s"></div>
                    <div class="typing-dot" style="animation-delay: 0.4s"></div>
                </div>
            `;
            
            chatContainerInner.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
